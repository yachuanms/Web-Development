services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/ricebook
      PORT: 3000
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  mongo_data: